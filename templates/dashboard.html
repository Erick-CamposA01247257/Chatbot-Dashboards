<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOSADENT — Panel de Citas</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --azul: #3B82F6;
            --azul-light: #EFF6FF;
            --azul-mid: #BFDBFE;
            --azul-dark: #1D4ED8;
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --borde: #E2E8F0;
            --texto: #0F172A;
            --texto-mid: #475569;
            --texto-muted: #94A3B8;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--texto);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ── */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--borde);
            padding: 0 20px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 12px;
        }

        .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }

        .logo { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        .logo-dot {
            width: 30px; height: 30px;
            background: var(--azul);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }

        .logo-dot svg { width: 14px; height: 14px; fill: white; }

        .logo-nombre {
            font-size: 14px; font-weight: 600;
            color: var(--texto); letter-spacing: -0.3px;
        }

        .header-divider {
            width: 1px; height: 20px;
            background: var(--borde);
            flex-shrink: 0;
        }

        .header-fecha {
            font-size: 13px; color: var(--texto-mid);
            white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-fecha strong { color: var(--texto); font-weight: 500; }

        .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        .badge-citas {
            background: var(--azul-light);
            color: var(--azul-dark);
            border: 1px solid var(--azul-mid);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 12px; font-weight: 500;
            white-space: nowrap;
        }

        .nav-fecha { display: flex; align-items: center; gap: 4px; }

        .nav-btn {
            width: 30px; height: 30px;
            border: 1px solid var(--borde);
            border-radius: 8px;
            background: var(--surface);
            cursor: pointer; font-size: 15px;
            color: var(--texto-mid);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
        }

        .nav-btn:hover { background: var(--bg); border-color: var(--azul-mid); color: var(--azul); }

        .btn-hoy {
            padding: 5px 10px;
            border: 1px solid var(--borde);
            border-radius: 8px;
            background: var(--surface);
            font-size: 12px; font-weight: 500;
            color: var(--texto-mid);
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.15s;
        }

        .btn-hoy:hover { background: var(--azul-light); border-color: var(--azul-mid); color: var(--azul); }

        /* ── Tabs móvil ── */
        .tabs-movil {
            display: none;
            background: var(--surface);
            border-bottom: 1px solid var(--borde);
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1; padding: 10px;
            border: none; background: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px; font-weight: 500;
            color: var(--texto-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
        }

        .tab-btn.activo {
            color: var(--azul);
            border-bottom-color: var(--azul);
        }

        /* ── Main layout ── */
        .main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }

        /* ── Panel izquierdo — Agenda ── */
        .panel-agenda {
            border-right: 1px solid var(--borde);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 14px 20px 10px;
            border-bottom: 1px solid var(--borde);
            flex-shrink: 0;
        }

        .panel-label {
            font-size: 11px; font-weight: 600;
            color: var(--texto-muted);
            letter-spacing: 0.8px; text-transform: uppercase;
        }

        .panel-subtitulo { font-size: 13px; color: var(--texto-mid); margin-top: 2px; }

        .agenda-scroll { flex: 1; overflow-y: auto; padding: 14px 20px; }

        /* ── Timeline ── */
        .timeline { display: flex; flex-direction: column; }

        .timeline-slot { display: flex; gap: 14px; min-height: 72px; }

        .timeline-hora-col { width: 40px; flex-shrink: 0; padding-top: 2px; }

        .timeline-hora { font-size: 12px; font-weight: 500; color: var(--texto-muted); text-align: right; }

        .timeline-linea-col {
            display: flex; flex-direction: column;
            align-items: center; flex-shrink: 0; width: 16px;
        }

        .timeline-punto {
            width: 10px; height: 10px;
            border-radius: 50%; background: var(--borde);
            flex-shrink: 0; margin-top: 4px;
        }

        .timeline-punto.activo { background: var(--azul); }

        .timeline-linea { width: 1px; flex: 1; background: var(--borde); margin-top: 4px; }

        .timeline-content { flex: 1; padding-bottom: 14px; }

        .cita-card {
            background: var(--surface);
            border: 1px solid var(--borde);
            border-radius: 10px;
            padding: 12px 14px;
            border-left: 4px solid var(--azul);
            margin-bottom: 8px;
        }

        .cita-card:last-child { margin-bottom: 0; }

        .cita-card-header {
            display: flex; align-items: flex-start;
            justify-content: space-between; margin-bottom: 6px;
        }

        .cita-paciente {
            font-size: 15px; font-weight: 600;
            color: var(--texto); line-height: 1.2;
        }

        .cita-hora-badge {
            background: var(--azul-light); color: var(--azul-dark);
            border-radius: 6px; padding: 3px 8px;
            font-size: 12px; font-weight: 500;
            flex-shrink: 0; margin-left: 8px;
        }

        .cita-detalle {
            font-size: 12px; color: var(--texto-mid);
            display: flex; align-items: center; gap: 8px;
        }

        .cita-detalle-sep {
            width: 3px; height: 3px;
            background: var(--texto-muted); border-radius: 50%;
        }

        .hora-vacia { color: var(--texto-muted); font-size: 12px; font-weight: 300; padding: 4px 0; }

        /* ── Panel derecho ── */
        .panel-cal {
            display: flex; flex-direction: column;
            overflow: hidden; background: var(--surface);
        }

        .cal-scroll { flex: 1; overflow-y: auto; padding: 14px 16px; }

        .mini-cal { margin-bottom: 14px; }

        .mini-cal-nav {
            display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 10px;
        }

        .mini-cal-mes { font-size: 13px; font-weight: 500; color: var(--texto); }

        .mini-cal-grid {
            display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 2px; text-align: center;
        }

        .mini-dia-nombre {
            font-size: 10px; color: var(--texto-muted);
            font-weight: 500; padding-bottom: 4px;
        }

        .mini-dia {
            padding: 6px 2px; border-radius: 6px;
            font-size: 12px; cursor: pointer;
            border: none; background: none;
            font-family: 'DM Sans', sans-serif;
            color: var(--texto-mid); transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .mini-dia:hover:not(:disabled) { background: var(--azul-light); color: var(--azul); }
        .mini-dia.hoy { font-weight: 600; color: var(--azul); }
        .mini-dia.seleccionado { background: var(--azul); color: white; font-weight: 500; }
        .mini-dia.tiene-citas { position: relative; }
        .mini-dia.tiene-citas::after {
            content: ''; display: block;
            width: 3px; height: 3px;
            background: var(--azul); border-radius: 50%;
            margin: 1px auto 0;
        }
        .mini-dia.seleccionado.tiene-citas::after { background: rgba(255,255,255,0.8); }
        .mini-dia:disabled { color: #CBD5E1; cursor: default; }

        .grid-sep { border-top: 1px solid var(--borde); margin-bottom: 10px; padding-top: 10px; }
        .grid-visual { position: relative; }

        .grid-fila-hora { display: flex; align-items: flex-start; gap: 8px; height: 72px; }

        .grid-hora-label {
            font-size: 10px; color: var(--texto-muted);
            width: 34px; flex-shrink: 0;
            text-align: right; padding-top: 2px; font-weight: 500;
        }

        .grid-hora-linea { flex: 1; border-top: 1px solid var(--borde); position: relative; height: 100%; }

        .grid-bloque {
            position: absolute;
            background: var(--azul-light);
            border: 1px solid var(--azul-mid);
            border-left: 3px solid var(--azul);
            border-radius: 6px; padding: 4px 8px;
            overflow: hidden; z-index: 1;
        }

        .grid-bloque-nombre {
            font-size: 11px; font-weight: 600; color: var(--azul-dark);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .grid-bloque-detalle {
            font-size: 10px; color: var(--azul); margin-top: 1px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* ── Estado confirmada ── */
        .cita-card.confirmada { border-left-color: #22C55E; }
        .cita-card.confirmada .cita-hora-badge { background: #F0FDF4; color: #15803D; }
        .grid-bloque.confirmado {
            background: #F0FDF4;
            border-color: #86EFAC;
            border-left-color: #22C55E;
        }
        .grid-bloque.confirmado .grid-bloque-nombre { color: #15803D; }
        .grid-bloque.confirmado .grid-bloque-detalle { color: #22C55E; }

        /* ── Modal ── */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(15,23,42,0.4);
            z-index: 100;
            align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-overlay.visible { display: flex; }

        .modal {
            background: var(--surface);
            border-radius: 16px;
            width: 100%; max-width: 380px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }

        .modal-header {
            display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 20px;
        }

        .modal-titulo { font-size: 16px; font-weight: 600; color: var(--texto); }

        .modal-close {
            width: 28px; height: 28px;
            border: none; background: var(--bg);
            border-radius: 8px; cursor: pointer;
            font-size: 16px; color: var(--texto-muted);
            display: flex; align-items: center; justify-content: center;
        }

        .modal-fila {
            display: flex; justify-content: space-between;
            align-items: center; padding: 10px 0;
            border-bottom: 1px solid var(--borde);
            font-size: 13px;
        }
        .modal-fila:last-of-type { border-bottom: none; }
        .modal-etiqueta { color: var(--texto-muted); font-weight: 500; }
        .modal-valor { color: var(--texto); font-weight: 500; text-align: right; }

        .modal-badge-pendiente {
            background: #FEF9C3; color: #854D0E;
            border-radius: 20px; padding: 3px 10px;
            font-size: 12px; font-weight: 500;
        }
        .modal-badge-confirmada {
            background: #F0FDF4; color: #15803D;
            border-radius: 20px; padding: 3px 10px;
            font-size: 12px; font-weight: 500;
        }

        .modal-acciones {
            display: flex; gap: 8px; margin-top: 20px;
        }

        .btn-modal-confirmar {
            flex: 1; padding: 11px;
            background: #22C55E; color: white;
            border: none; border-radius: 10px;
            font-size: 13px; font-weight: 500;
            cursor: pointer; font-family: 'DM Sans', sans-serif;
            transition: background 0.2s;
        }
        .btn-modal-confirmar:hover { background: #16A34A; }
        .btn-modal-confirmar:disabled { background: var(--texto-muted); cursor: default; }

        .btn-modal-eliminar {
            flex: 1; padding: 11px;
            background: #FEF2F2; color: #DC2626;
            border: 1px solid #FECACA; border-radius: 10px;
            font-size: 13px; font-weight: 500;
            cursor: pointer; font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
        }
        .btn-modal-eliminar:hover { background: #FEE2E2; }

        /* ── Modal nueva cita ── */
        .form-campo { margin-bottom: 14px; }
        .form-campo label {
            display: block; font-size: 11px; font-weight: 600;
            color: var(--texto-muted); text-transform: uppercase;
            letter-spacing: 0.4px; margin-bottom: 5px;
        }
        .form-campo input, .form-campo select {
            width: 100%; border: 1px solid var(--borde);
            border-radius: 8px; padding: 9px 12px;
            font-size: 13px; font-family: 'DM Sans', sans-serif;
            background: var(--bg); color: var(--texto);
            outline: none; transition: border-color 0.2s;
        }
        .form-campo input:focus, .form-campo select:focus { border-color: var(--azul); }
        .form-campo input.error, .form-campo select.error { border-color: #EF4444; }
        .form-error { font-size: 11px; color: #EF4444; margin-top: 4px; display: none; }
        .form-error.visible { display: block; }

        .btn-nueva-cita {
            padding: 6px 12px;
            background: var(--azul); color: white;
            border: none; border-radius: 8px;
            font-size: 12px; font-weight: 500;
            cursor: pointer; font-family: 'DM Sans', sans-serif;
            transition: background 0.2s;
        }
        .btn-nueva-cita:hover { background: var(--azul-dark); }

        /* ── Responsive móvil ── */
        @media (max-width: 640px) {
            .header-divider { display: none; }
            .header-fecha { display: none; }

            .tabs-movil { display: flex; }

            .main {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr;
            }

            .panel-agenda { border-right: none; }

            .panel-agenda.oculto { display: none; }
            .panel-cal.oculto { display: none; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <div class="logo">
            <div class="logo-dot">
                <svg viewBox="0 0 24 24"><path d="M12 2C8.5 2 7 4.5 7 7c0 1.5.5 3 1 4.5C8.5 13 9 14.5 9 16c0 2 .5 4 3 4s3-2 3-4c0-1.5.5-3 1-4.5C16.5 10 17 8.5 17 7c0-2.5-1.5-5-5-5z"/></svg>
            </div>
            <span class="logo-nombre">MOSADENT</span>
        </div>
        <div class="header-divider"></div>
        <div class="header-fecha" id="header-fecha"></div>
    </div>
    <div class="header-right">
        <div class="nav-fecha">
            <button class="nav-btn" onclick="navegarDia(-1)">‹</button>
            <button class="btn-hoy" onclick="irHoy()">Hoy</button>
            <button class="nav-btn" onclick="navegarDia(1)">›</button>
        </div>
        <div class="badge-citas" id="badge-citas">0 citas</div>
        <button class="btn-nueva-cita" onclick="abrirNuevaCita()">+ Nueva cita</button>
    </div>
</div>

<div class="tabs-movil">
    <button class="tab-btn activo" id="tab-agenda" onclick="cambiarTab('agenda')">📋 Agenda</button>
    <button class="tab-btn" id="tab-cal" onclick="cambiarTab('cal')">📅 Calendario</button>
</div>

<div class="modal-overlay" id="modal-nueva-overlay" onclick="cerrarNuevaCita(event)">
    <div class="modal" id="modal-nueva">
        <div class="modal-header">
            <div class="modal-titulo">Nueva cita</div>
            <button class="modal-close" onclick="cerrarNuevaCitaDirecto()">✕</button>
        </div>
        <div class="form-campo">
            <label>Nombre del paciente</label>
            <input type="text" id="nc-nombre" placeholder="Ej. María González" maxlength="100" />
        </div>
        <div class="form-campo">
            <label>Teléfono</label>
            <input type="tel" id="nc-telefono" placeholder="10 dígitos" maxlength="10" inputmode="numeric" />
        </div>
        <div class="form-campo">
            <label>Servicio</label>
            <select id="nc-servicio" onchange="cargarSlotsNuevaCita()">
                <option value="">Seleccione un servicio</option>
                <option value="Limpieza dental">Limpieza dental (30 min)</option>
                <option value="Revisión y diagnóstico general">Revisión y diagnóstico general (30 min)</option>
                <option value="Blanqueamiento dental">Blanqueamiento dental (60 min)</option>
                <option value="Resinas y restauraciones">Resinas y restauraciones (60 min)</option>
                <option value="Extracciones">Extracciones (45 min)</option>
                <option value="Ortodoncia y brackets">Ortodoncia y brackets (60 min)</option>
                <option value="Implantes dentales">Implantes dentales (90 min)</option>
            </select>
        </div>
        <div class="form-campo">
            <label>Fecha</label>
            <input type="date" id="nc-fecha" onchange="cargarSlotsNuevaCita()" />
        </div>
        <div class="form-campo">
            <label>Hora disponible</label>
            <select id="nc-hora">
                <option value="">Seleccione fecha y servicio primero</option>
            </select>
            <div class="form-error" id="nc-error"></div>
        </div>
        <div class="modal-acciones">
            <button class="btn-modal-confirmar" id="btn-nc-guardar" onclick="guardarNuevaCita()">Guardar cita</button>
            <button class="btn-modal-eliminar" onclick="cerrarNuevaCitaDirecto()">Cancelar</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="cerrarModal(event)">
    <div class="modal" id="modal">
        <div class="modal-header">
            <div class="modal-titulo">Detalle de cita</div>
            <button class="modal-close" onclick="cerrarModalDirecto()">✕</button>
        </div>
        <div class="modal-fila">
            <span class="modal-etiqueta">Paciente</span>
            <span class="modal-valor" id="m-nombre"></span>
        </div>
        <div class="modal-fila">
            <span class="modal-etiqueta">Teléfono</span>
            <span class="modal-valor" id="m-telefono"></span>
        </div>
        <div class="modal-fila">
            <span class="modal-etiqueta">Servicio</span>
            <span class="modal-valor" id="m-servicio"></span>
        </div>
        <div class="modal-fila">
            <span class="modal-etiqueta">Fecha</span>
            <span class="modal-valor" id="m-fecha"></span>
        </div>
        <div class="modal-fila">
            <span class="modal-etiqueta">Hora</span>
            <span class="modal-valor" id="m-hora"></span>
        </div>
        <div class="modal-fila">
            <span class="modal-etiqueta">Duración</span>
            <span class="modal-valor" id="m-duracion"></span>
        </div>
        <div class="modal-fila">
            <span class="modal-etiqueta">Estado</span>
            <span id="m-estado"></span>
        </div>
        <div class="modal-acciones">
            <button class="btn-modal-confirmar" id="btn-modal-confirmar" onclick="confirmarCita()">Confirmar</button>
            <button class="btn-modal-eliminar" onclick="eliminarCita()">Eliminar</button>
        </div>
    </div>
</div>

<div class="main">

    <div class="panel-agenda" id="panel-agenda">
        <div class="panel-header">
            <div class="panel-label">Agenda del día</div>
            <div class="panel-subtitulo" id="agenda-subtitulo"></div>
        </div>
        <div class="agenda-scroll">
            <div class="timeline" id="timeline"></div>
        </div>
    </div>

    <div class="panel-cal oculto" id="panel-cal">
        <div class="panel-header">
            <div class="panel-label">Calendario</div>
            <div class="panel-subtitulo">Vista por bloques</div>
        </div>
        <div class="cal-scroll">
            <div class="mini-cal">
                <div class="mini-cal-nav">
                    <span class="mini-cal-mes" id="mini-cal-titulo"></span>
                    <div style="display:flex;gap:4px">
                        <button class="nav-btn" style="width:26px;height:26px;font-size:13px" onclick="cambiarMes(-1)">‹</button>
                        <button class="nav-btn" style="width:26px;height:26px;font-size:13px" onclick="cambiarMes(1)">›</button>
                    </div>
                </div>
                <div class="mini-cal-grid" id="mini-cal-grid"></div>
            </div>
            <div class="grid-sep">
                <div class="panel-label" style="margin-bottom:10px">Vista horaria</div>
                <div class="grid-visual" id="grid-visual"></div>
            </div>
        </div>
    </div>
</div>

<script>
    function escaparHTML(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;')
    }

    const HORA_INICIO = 10
    const HORA_FIN = 19
    const ALTURA_HORA = 72

    let todasLasCitas = []
    let fechaSeleccionada = new Date().toISOString().split("T")[0]
    let calMes = new Date().getMonth()
    let calAño = new Date().getFullYear()
    let tabActivo = "agenda"

    const hoyStr = new Date().toISOString().split("T")[0]
    const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"]
    const diasCortos = ["Do","Lu","Ma","Mi","Ju","Vi","Sá"]

    async function cargarCitas() {
        const res = await fetch("/api/citas")
        const data = await res.json()
        todasLasCitas = data.citas
        render()
    }

    function render() {
        actualizarHeader()
        renderTimeline()
        renderMiniCal()
        renderGridVisual()
    }

    function cambiarTab(tab) {
        tabActivo = tab
        const panelAgenda = document.getElementById("panel-agenda")
        const panelCal = document.getElementById("panel-cal")
        const tabAgenda = document.getElementById("tab-agenda")
        const tabCal = document.getElementById("tab-cal")

        if (tab === "agenda") {
            panelAgenda.classList.remove("oculto")
            panelCal.classList.add("oculto")
            tabAgenda.classList.add("activo")
            tabCal.classList.remove("activo")
        } else {
            panelCal.classList.remove("oculto")
            panelAgenda.classList.add("oculto")
            tabCal.classList.add("activo")
            tabAgenda.classList.remove("activo")
        }
    }

    function actualizarHeader() {
        const fecha = new Date(fechaSeleccionada + "T12:00:00")
        const esHoy = fechaSeleccionada === hoyStr
        const prefijo = esHoy ? "Hoy — " : ""
        const fechaStr = fecha.toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric" })
        document.getElementById("header-fecha").innerHTML = `${prefijo}<strong>${fechaStr}</strong>`

        const citasDelDia = todasLasCitas.filter(c => c.fecha === fechaSeleccionada)
        document.getElementById("badge-citas").textContent = `${citasDelDia.length} cita${citasDelDia.length !== 1 ? 's' : ''} hoy`

        const diaStr = fecha.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" })
        document.getElementById("agenda-subtitulo").textContent = diaStr.charAt(0).toUpperCase() + diaStr.slice(1)
    }

    function renderTimeline() {
        const citasDelDia = todasLasCitas
            .filter(c => c.fecha === fechaSeleccionada)
            .sort((a, b) => a.hora.localeCompare(b.hora))

        const citasPorHora = {}
        citasDelDia.forEach(c => {
            const h = parseInt(c.hora.split(":")[0])
            if (!citasPorHora[h]) citasPorHora[h] = []
            citasPorHora[h].push(c)
        })

        const timeline = document.getElementById("timeline")
        timeline.innerHTML = ""

        for (let h = HORA_INICIO; h < HORA_FIN; h++) {
            const citas = citasPorHora[h]
            const slot = document.createElement("div")
            slot.className = "timeline-slot"
            slot.innerHTML = `
                <div class="timeline-hora-col">
                    <span class="timeline-hora">${h}:00</span>
                </div>
                <div class="timeline-linea-col">
                    <div class="timeline-punto ${citas ? 'activo' : ''}"></div>
                    <div class="timeline-linea"></div>
                </div>
                <div class="timeline-content">
                    ${citas ? citas.map(c => `
                        <div class="cita-card ${c.confirmada ? 'confirmada' : ''}" onclick="abrirModal(${c.id})" style="cursor:pointer">
                            <div class="cita-card-header">
                                <div class="cita-paciente">${escaparHTML(c.nombre)}</div>
                                <div class="cita-hora-badge">${convertir12h(c.hora)}</div>
                            </div>
                            <div class="cita-detalle">
                                <span>${escaparHTML(c.servicio)}</span>
                                <div class="cita-detalle-sep"></div>
                                <span>${c.duracion} min</span>
                            </div>
                        </div>`).join("") : `<div class="hora-vacia">Disponible</div>`}
                </div>`
            timeline.appendChild(slot)
        }

        if (citasDelDia.length === 0) {
            const empty = document.createElement("div")
            empty.style.cssText = "text-align:center;padding:48px 20px;color:var(--texto-muted)"
            empty.innerHTML = `
                <div style="font-size:28px;margin-bottom:10px">📭</div>
                <div style="font-size:14px;font-weight:500">Sin citas para este día</div>
                <div style="font-size:12px;margin-top:4px;font-weight:300">El día está libre</div>`
            timeline.appendChild(empty)
        }
    }

    function renderMiniCal() {
        document.getElementById("mini-cal-titulo").textContent = `${meses[calMes]} ${calAño}`
        const grid = document.getElementById("mini-cal-grid")
        grid.innerHTML = diasCortos.map(d => `<div class="mini-dia-nombre">${d}</div>`).join("")

        const primerDia = new Date(calAño, calMes, 1).getDay()
        const totalDias = new Date(calAño, calMes + 1, 0).getDate()
        const fechasConCitas = new Set(todasLasCitas.map(c => c.fecha))

        for (let i = 0; i < primerDia; i++) grid.innerHTML += `<div></div>`

        for (let d = 1; d <= totalDias; d++) {
            const fecha = `${calAño}-${String(calMes+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`
            const esHoy = fecha === hoyStr
            const seleccionado = fecha === fechaSeleccionada
            const tieneCitas = fechasConCitas.has(fecha)

            grid.innerHTML += `<button class="mini-dia
                ${esHoy ? 'hoy' : ''}
                ${seleccionado ? 'seleccionado' : ''}
                ${tieneCitas && !seleccionado ? 'tiene-citas' : ''}"
                onclick="seleccionarFecha('${fecha}')">${d}</button>`
        }
    }

    function renderGridVisual() {
        const citasDelDia = todasLasCitas.filter(c => c.fecha === fechaSeleccionada)
        const grid = document.getElementById("grid-visual")
        grid.innerHTML = ""

        const wrapper = document.createElement("div")
        wrapper.style.position = "relative"

        for (let h = HORA_INICIO; h < HORA_FIN; h++) {
            const fila = document.createElement("div")
            fila.className = "grid-fila-hora"
            fila.innerHTML = `
                <div class="grid-hora-label">${h}:00</div>
                <div class="grid-hora-linea"></div>`
            wrapper.appendChild(fila)
        }

        grid.appendChild(wrapper)

        citasDelDia.forEach(cita => {
            const [hh, mm] = cita.hora.split(":").map(Number)
            const top = (hh - HORA_INICIO + mm / 60) * ALTURA_HORA
            const height = Math.max((cita.duracion / 60) * ALTURA_HORA - 4, 28)
            const bloque = document.createElement("div")
            bloque.className = "grid-bloque"
            bloque.style.cssText = `top:${top}px; height:${height}px; left:46px; right:4px; position:absolute;`
            bloque.className = `grid-bloque ${cita.confirmada ? 'confirmado' : ''}`
            bloque.style.cursor = "pointer"
            bloque.onclick = () => abrirModal(cita.id)
            bloque.innerHTML = `
                <div class="grid-bloque-nombre">${escaparHTML(cita.nombre)}</div>
                <div class="grid-bloque-detalle">${convertir12h(cita.hora)} · ${escaparHTML(cita.servicio)}</div>`
            wrapper.appendChild(bloque)
        })
    }

    function seleccionarFecha(fecha) {
        fechaSeleccionada = fecha
        calMes = parseInt(fecha.split("-")[1]) - 1
        calAño = parseInt(fecha.split("-")[0])
        render()
        if (window.innerWidth <= 640) cambiarTab("agenda")
    }

    function navegarDia(delta) {
        const d = new Date(fechaSeleccionada + "T12:00:00")
        d.setDate(d.getDate() + delta)
        fechaSeleccionada = d.toISOString().split("T")[0]
        calMes = d.getMonth()
        calAño = d.getFullYear()
        render()
    }

    function irHoy() {
        fechaSeleccionada = hoyStr
        calMes = new Date().getMonth()
        calAño = new Date().getFullYear()
        render()
    }

    function cambiarMes(delta) {
        calMes += delta
        if (calMes < 0) { calMes = 11; calAño-- }
        if (calMes > 11) { calMes = 0; calAño++ }
        renderMiniCal()
    }

    function convertir12h(hora24) {
        const [h, m] = hora24.split(":").map(Number)
        const suffix = h >= 12 ? "PM" : "AM"
        const h12 = h % 12 || 12
        return `${h12}:${String(m).padStart(2,"0")} ${suffix}`
    }

    // ── Nueva cita ──
    function abrirNuevaCita() {
        const hoy = new Date().toISOString().split("T")[0]
        document.getElementById("nc-nombre").value = ""
        document.getElementById("nc-telefono").value = ""
        document.getElementById("nc-servicio").value = ""
        document.getElementById("nc-fecha").value = fechaSeleccionada >= hoy ? fechaSeleccionada : hoy
        document.getElementById("nc-fecha").min = hoy
        document.getElementById("nc-hora").innerHTML = `<option value="">Seleccione fecha y servicio primero</option>`
        document.getElementById("nc-error").classList.remove("visible")
        document.getElementById("btn-nc-guardar").disabled = false
        document.getElementById("btn-nc-guardar").textContent = "Guardar cita"
        document.getElementById("modal-nueva-overlay").classList.add("visible")
        cargarSlotsNuevaCita()
    }

    function cerrarNuevaCita(e) {
        if (e.target === document.getElementById("modal-nueva-overlay")) cerrarNuevaCitaDirecto()
    }

    function cerrarNuevaCitaDirecto() {
        document.getElementById("modal-nueva-overlay").classList.remove("visible")
    }

    async function cargarSlotsNuevaCita() {
        const servicio = document.getElementById("nc-servicio").value
        const fecha = document.getElementById("nc-fecha").value
        const selectHora = document.getElementById("nc-hora")
        if (!servicio || !fecha) {
            selectHora.innerHTML = `<option value="">Seleccione fecha y servicio primero</option>`
            return
        }
        selectHora.innerHTML = `<option value="">Cargando...</option>`
        const res = await fetch(`/api/slots?fecha=${fecha}&servicio=${encodeURIComponent(servicio)}`)
        const data = await res.json()
        if (data.slots.length === 0) {
            selectHora.innerHTML = `<option value="">Sin horarios disponibles</option>`
        } else {
            selectHora.innerHTML = `<option value="">Seleccione hora</option>` +
                data.slots.map(s => `<option value="${s}">${convertir12h(s)}</option>`).join("")
        }
    }

    async function guardarNuevaCita() {
        const nombre = document.getElementById("nc-nombre").value.trim()
        const telefono = document.getElementById("nc-telefono").value.replace(/\D/g, "")
        const servicio = document.getElementById("nc-servicio").value
        const fecha = document.getElementById("nc-fecha").value
        const hora = document.getElementById("nc-hora").value
        const errorEl = document.getElementById("nc-error")

        errorEl.classList.remove("visible")

        if (!nombre || !servicio || !fecha || !hora) {
            errorEl.textContent = "Complete todos los campos obligatorios."
            errorEl.classList.add("visible")
            return
        }
        if (telefono && telefono.length !== 10) {
            errorEl.textContent = "El teléfono debe tener 10 dígitos."
            errorEl.classList.add("visible")
            return
        }

        const btn = document.getElementById("btn-nc-guardar")
        btn.disabled = true
        btn.textContent = "Guardando..."

        const res = await fetch("/api/agendar-dashboard", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nombre, telefono, servicio, fecha, hora })
        })

        if (res.ok) {
            cerrarNuevaCitaDirecto()
            fechaSeleccionada = fecha
            await cargarCitas()
        } else {
            errorEl.textContent = "Ese horario ya no está disponible."
            errorEl.classList.add("visible")
            btn.disabled = false
            btn.textContent = "Guardar cita"
            await cargarSlotsNuevaCita()
        }
    }

    let citaModal = null

    function abrirModal(id) {
        citaModal = todasLasCitas.find(c => c.id === id)
        if (!citaModal) return

        const fechaLeg = new Date(citaModal.fecha + "T12:00:00").toLocaleDateString("es-MX", {
            weekday: "long", day: "numeric", month: "long", year: "numeric"
        })

        document.getElementById("m-nombre").textContent = citaModal.nombre
        document.getElementById("m-telefono").textContent = citaModal.telefono || "No registrado"
        document.getElementById("m-servicio").textContent = citaModal.servicio
        document.getElementById("m-fecha").textContent = fechaLeg.charAt(0).toUpperCase() + fechaLeg.slice(1)
        document.getElementById("m-hora").textContent = convertir12h(citaModal.hora)
        document.getElementById("m-duracion").textContent = `${citaModal.duracion} min`

        const estadoEl = document.getElementById("m-estado")
        const btnConfirmar = document.getElementById("btn-modal-confirmar")
        if (citaModal.confirmada) {
            estadoEl.innerHTML = `<span class="modal-badge-confirmada">Confirmada</span>`
            btnConfirmar.disabled = true
            btnConfirmar.textContent = "Ya confirmada"
        } else {
            estadoEl.innerHTML = `<span class="modal-badge-pendiente">Pendiente</span>`
            btnConfirmar.disabled = false
            btnConfirmar.textContent = "Confirmar"
        }

        document.getElementById("modal-overlay").classList.add("visible")
    }

    function cerrarModal(e) {
        if (e.target === document.getElementById("modal-overlay")) cerrarModalDirecto()
    }

    function cerrarModalDirecto() {
        document.getElementById("modal-overlay").classList.remove("visible")
        citaModal = null
    }

    async function confirmarCita() {
        if (!citaModal) return
        const res = await fetch(`/api/citas/${citaModal.id}/confirmar`, { method: "PATCH" })
        if (res.ok) {
            cerrarModalDirecto()
            await cargarCitas()
        }
    }

    async function eliminarCita() {
        if (!citaModal) return
        if (!confirm(`¿Eliminar la cita de ${citaModal.nombre}?`)) return
        const res = await fetch(`/api/citas/${citaModal.id}`, { method: "DELETE" })
        if (res.ok) {
            cerrarModalDirecto()
            await cargarCitas()
        }
    }

    cargarCitas()
    setInterval(cargarCitas, 30000)
</script>
</body>
</html>
